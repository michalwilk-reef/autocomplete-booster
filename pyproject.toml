[project]
name = "fastcomplete"
version = "0.3.0"
description = "Build-time argparse metadata for fast static shell completion"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Michał Wilk" }]
dependencies = ["argcomplete==3.7.0"]

[project.optional-dependencies]
build = ["setuptools>=77", "tomli>=2"]

[project.urls]
Repository = "https://github.com/michalwilk-reef/autocomplete-booster"
Documentation = "https://github.com/michalwilk-reef/autocomplete-booster#readme"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
