[project]
name = "autocomplete-booster"
version = "0.1.0"
description = "Deferred command imports for responsive argparse and argcomplete CLIs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Michał Wilk" }]
dependencies = []

[project.urls]
Repository = "https://github.com/michalwilk-reef/autocomplete-booster"
Documentation = "https://github.com/michalwilk-reef/autocomplete-booster#readme"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
source-include = ["tests/**", "DESIGN.md"]
